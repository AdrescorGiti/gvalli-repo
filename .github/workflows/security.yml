name: GValli Security Sentinel

on:
  pull_request:
    paths:
      - 'packages/**/*.gpkg'
  push:
    branches:
      - main
    paths:
      - 'packages/**/*.gpkg'

# Жесткое ограничение прав доступа для пайплайна
permissions:
  contents: read
  pull-requests: write

jobs:
  static-and-dynamic-analysis:
    name: Core Package Inspection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Sentinel Environment (Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav shellcheck yara
          sudo freshclam
          
      - name: Install Python Core
        run: pip install aiohttp yara-python

      - name: Execute ClamAV System Scan
        run: |
          echo "::group::ClamAV Results"
          clamscan --infected --recursive packages/ || exit 1
          echo "::endgroup::"

      - name: Run GValli Python Sentinel
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          for pkg in packages/*.gpkg; do
            echo "Сканирование $pkg..."
            python3 scripts/sentinel.py "$pkg"
          done

      - name: Dynamic Sandbox Execution (Dry-Run)
        run: |
          # Запуск внутри полностью изолированного контейнера без интернета
          for pkg in packages/*.gpkg; do
            echo "Попытка тестовой распаковки $pkg в песочнице..."
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              -v ${{ github.workspace }}:/workspace:ro \
              ubuntu:latest \
              bash -c "tar -tvf /workspace/$pkg"
          done
          
