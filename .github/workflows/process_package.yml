name: Process Package Submission

on:
  issues:
    types: [opened, edited]

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Issue Body
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser

      - name: Check if it's a package submission
        id: check
        run: |
          TITLE="${{ github.event.issue.title }}"
          if [[ "$TITLE" != *"[Package]"* ]]; then
            echo "Not a package submission issue. Skipping."
            echo "is_package=false" >> $GITHUB_ENV
          else
            echo "is_package=true" >> $GITHUB_ENV
          fi

      - name: Extract Data
        if: env.is_package == 'true'
        id: data
        run: |
          NAME=$(echo '${{ steps.issue-parser.outputs.jsonIssue }}' | jq -r '.parseResult.name // empty')
          VERSION=$(echo '${{ steps.issue-parser.outputs.jsonIssue }}' | jq -r '.parseResult.version // empty')
          DESC=$(echo '${{ steps.issue-parser.outputs.jsonIssue }}' | jq -r '.parseResult.description // empty')
          URL=$(echo '${{ steps.issue-parser.outputs.jsonIssue }}' | jq -r '.parseResult.url // empty')

          echo "NAME=$NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DESC=$DESC" >> $GITHUB_ENV
          echo "URL=$URL" >> $GITHUB_ENV
          
          if [ -z "$NAME" ] || [ -z "$URL" ]; then
            echo "Error: Required fields are missing!"
            exit 1
          fi

      - name: Download package and calculate SHA256
        if: env.is_package == 'true'
        run: |
          echo "Downloading package from ${{ env.URL }}..."
          curl -L "${{ env.URL }}" -o package.gpkg
          
          SHA256=$(sha256sum package.gpkg | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "Calculated SHA256: $SHA256"

      - name: Update packages.json
        if: env.is_package == 'true'
        run: |
          python3 -c "
          import json
          import os

          json_file = 'packages.json'
          
          if os.path.exists(json_file):
              with open(json_file, 'r') as f:
                  data = json.load(f)
          else:
              data = {'packages': []}

          new_package = {
              'name': os.environ['NAME'],
              'version': os.environ['VERSION'],
              'description': os.environ['DESC'],
              'url': os.environ['URL'],
              'sha256': os.environ['SHA256']
          }

          # Удаляем старую версию пакета, если она уже была, и добавляем актуальную
          data['packages'] = [p for p in data['packages'] if p['name'] != new_package['name']]
          data['packages'].append(new_package)

          with open(json_file, 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit and Push changes
        if: env.is_package == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add package ${{ env.NAME }} via automated request"
          file_pattern: "packages.json"

      - name: Close Issue and Comment
        if: env.is_package == 'true'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            🎉 Поздравляем! Ваш пакет **${{ env.NAME }}** успешно добавлен в репозиторий G OS.
            SHA256: `${{ env.SHA256 }}`
