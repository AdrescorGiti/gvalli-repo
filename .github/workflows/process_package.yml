name: Process Package Submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Issue, Scan Security, and Update JSON
        run: |
          cat << 'EOF' > script.py
          import json, os, re, hashlib, subprocess, tarfile, shutil

          # 1. Чтение события GitHub
          event_path = os.environ['GITHUB_EVENT_PATH']
          with open(event_path, 'r', encoding='utf-8') as f:
              event = json.load(f)

          issue = event.get('issue', {})
          title = issue.get('title', '')
          body = issue.get('body', '')
          issue_author = issue.get('user', {}).get('login', '')

          # Проверка заголовка
          if '[Package]' not in title:
              print('Not a package submission. Skipping.')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write('IS_PACKAGE=false\n')
              exit(0)

          # Парсинг тела Issue
          sections = re.split(r'###\s+', body)
          data = {}
          for sec in sections:
              if not sec.strip(): continue
              lines = sec.strip().split('\n')
              data[lines[0].strip()] = '\n'.join(lines[1:]).strip()

          name = data.get('Package Name', '').strip()
          version = data.get('Version', '').strip()
          description = data.get('Description', '').strip()
          url = data.get('Direct Download URL (.gpkg)', '').strip()
          
          deps_raw = data.get('Dependencies', '').strip()
          dependencies = [d.strip() for d in re.split(r'[,;\s]+', deps_raw) if d.strip()] if deps_raw and deps_raw.lower() not in ['none', '_no response_'] else []

          if not name or not url:
              print('Error: Missing required fields.')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write('IS_PACKAGE=true\nUNAUTHORIZED=false\nMALWARE=true\n')
                  f.write(f'PKG_NAME={name or "Unknown"}\nMALWARE_REASON=Заполнены не все обязательные поля.\n')
              exit(0)

          # Поиск файла индекса
          json_file = 'packages.json' if os.path.exists('packages.json') else 'pakages.json' if os.path.exists('pakages.json') else 'packages.json'
          pkg_data = {'packages': []}
          if os.path.exists(json_file) and os.path.getsize(json_file) > 0:
              try:
                  with open(json_file, 'r', encoding='utf-8') as f:
                      loaded = json.load(f)
                      if isinstance(loaded, dict) and 'packages' in loaded:
                          pkg_data = loaded
                      elif isinstance(loaded, list):
                          pkg_data = {'packages': loaded}
              except Exception as e:
                  print(f'Warning: JSON read error ({e}).')

          # 2. ПРОВЕРКА ПРАВ СОЗДАТЕЛЯ
          existing_pkg = next((p for p in pkg_data.get('packages', []) if p.get('name') == name), None)
          if existing_pkg:
              original_creator = existing_pkg.get('creator', '')
              if original_creator and original_creator.lower() != issue_author.lower():
                  print(f'Unauthorized attempt by @{issue_author}')
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                      f.write('IS_PACKAGE=true\nUNAUTHORIZED=true\nMALWARE=false\n')
                      f.write(f'PKG_NAME={name}\nORIGINAL_CREATOR={original_creator}\n')
                  exit(0)

          # 3. НАДЕЖНОЕ СКАЧИВАНИЕ ЧЕРЕЗ CURL (ПРОБИВАЕТ 302 РЕДИРЕКТЫ GITHUB RELEASES)
          print(f"Downloading {url} via curl...")
          curl_cmd = ["curl", "-sSL", "-A", "Mozilla/5.0 (X11; Linux x86_64)", "-o", "package.gpkg", url]
          res = subprocess.run(curl_cmd, capture_output=True)

          if res.returncode != 0 or not os.path.exists('package.gpkg') or os.path.getsize('package.gpkg') == 0:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write('IS_PACKAGE=true\nUNAUTHORIZED=false\nMALWARE=true\n')
                  f.write(f'PKG_NAME={name}\nMALWARE_REASON=Ошибка скачивания файла по указанной ссылке.\n')
              exit(0)

          # 4. АНТИВИРУСНЫЙ СКАНЕР И ПРОВЕРКА ЦЕЛОСТНОСТИ
          BLACKLIST = [
              b"rm -rf /", b"sudo rm -rf", b"mkfs", b"wipefs", b"dd if=", b"> /etc/passwd",
              b"> /etc/shadow", b"> /etc/sudoers", b"chmod 777 /", b"chmod -R 777 /",
              b"bash -i", b"nc -e", b"nc -c", b"/dev/tcp/", b"/dev/udp/",
              b"curl | bash", b"curl | sh", b"wget -qO- | sh", b"base64 -d | sh"
          ]
          
          is_clean = True
          malware_reason = ""
          extract_dir = "extract_eval"
          
          # Проверка на HTML вместо архива
          with open('package.gpkg', 'rb') as f:
              header = f.read(200)
              if b'<!DOCTYPE html>' in header or b'<html' in header.lower():
                  is_clean = False
                  malware_reason = "По ссылке скачалась HTML-страница ошибки/редиректа вместо файла .gpkg."

          # Распаковка и проверка Zip-Slip
          if is_clean:
              try:
                  with tarfile.open('package.gpkg', "r:*") as tar:
                      for member in tar.getmembers():
                          if member.name.startswith("/") or "../" in member.name:
                              is_clean = False
                              malware_reason = f"ZIP-SLIP АТАКА в файле {member.name}"
                              break
                      if is_clean:
                          tar.extractall(path=extract_dir)
              except Exception as e:
                  is_clean = False
                  # Очищаем причину от переносов строк, чтобы не ломать GITHUB_ENV
                  clean_err = str(e).replace('\n', ' ').replace('\r', ' ')
                  malware_reason = f"Файл не является валидным архивом .gpkg ({clean_err})"

          # Пофайловый анализ
          if is_clean:
              for root, _, files in os.walk(extract_dir):
                  for file in files:
                      try:
                          with open(os.path.join(root, file), "rb") as f:
                              content = f.read()
                              for danger in BLACKLIST:
                                  if danger in content:
                                      is_clean = False
                                      malware_reason = f"Вредоносный код ({danger.decode('utf-8', errors='ignore')}) в файле {file}"
                                      break
                      except Exception as e:
                          print(f"Read error: {e}")
                      if not is_clean: break
                  if not is_clean: break

          if os.path.exists(extract_dir):
              shutil.rmtree(extract_dir)

          if not is_clean:
              # ВАЖНО: удаляем переводы строк из причины для безопасности GITHUB_ENV
              safe_reason = malware_reason.replace('\n', ' ').replace('\r', ' ')
              print(f"Security/Archive error: {safe_reason}")
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write('IS_PACKAGE=true\nUNAUTHORIZED=false\nMALWARE=true\n')
                  f.write(f'PKG_NAME={name}\nMALWARE_REASON={safe_reason}\n')
              exit(0)

          # 5. ХЕШ И ОБНОВЛЕНИЕ JSON
          hasher = hashlib.sha256()
          with open('package.gpkg', 'rb') as f:
              while chunk := f.read(8192): hasher.update(chunk)
          sha256 = hasher.hexdigest()

          creator_name = existing_pkg.get('creator', issue_author) if existing_pkg else issue_author

          pkg_data['packages'] = [p for p in pkg_data.get('packages', []) if p.get('name') != name]
          pkg_data['packages'].append({
              'name': name,
              'version': version,
              'description': description,
              'creator': creator_name,
              'dependencies': dependencies,
              'url': url,
              'sha256': sha256
          })

          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(pkg_data, f, indent=2, ensure_ascii=False)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('IS_PACKAGE=true\nUNAUTHORIZED=false\nMALWARE=false\n')
              f.write(f'PKG_NAME={name}\nPKG_SHA256={sha256}\nTARGET_JSON={json_file}\n')
          EOF
          
          python3 script.py

      - name: Commit and Push changes
        if: env.IS_PACKAGE == 'true' && env.UNAUTHORIZED == 'false' && env.MALWARE == 'false'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update package ${{ env.PKG_NAME }} via automated request"
          file_pattern: "${{ env.TARGET_JSON }}"

      - name: Comment and Close (Success)
        if: env.IS_PACKAGE == 'true' && env.UNAUTHORIZED == 'false' && env.MALWARE == 'false'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            🎉 Поздравляем! Пакет **${{ env.PKG_NAME }}** успешно прошел проверки безопасности и обновлен в репозитории!
            
            **Метаданные:**
            * **SHA256:** `${{ env.PKG_SHA256 }}`
            * **Индекс:** `${{ env.TARGET_JSON }}`

      - name: Comment and Close (Unauthorized)
        if: env.IS_PACKAGE == 'true' && env.UNAUTHORIZED == 'true'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            🚫 **Отказ в обновлении пакета!**
            Пакет **${{ env.PKG_NAME }}** принадлежит пользователю **@${{ env.ORIGINAL_CREATOR }}**. 
            Только первоначальный создатель пакета может публиковать для него обновления.

      - name: Comment and Close (Security / Archive Error)
        if: env.IS_PACKAGE == 'true' && env.MALWARE == 'true'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            🛑 **ОШИБКА ПРОВЕРКИ ИЛИ БЛОКИРОВКА ПАКЕТА!**
            Пакет **${{ env.PKG_NAME }}** был отклонен сканером GValli Sentinel.
            
            **Причина:**
            > ${{ env.MALWARE_REASON }}
            
            Пакет **НЕ БЫЛ** добавлен в базу. Проверьте ссылку и целостность архива.
            
