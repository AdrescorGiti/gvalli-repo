name: Process Package Submission

on:
  issues:
    types: [opened, edited]

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Issue, Download and Update JSON
        run: |
          python3 -c "
          import json, os, re, hashlib, urllib.request

          # Читаем исходный файл события GitHub
          event_path = os.environ['GITHUB_EVENT_PATH']
          with open(event_path, 'r', encoding='utf-8') as f:
              event = json.load(f)

          issue = event.get('issue', {})
          title = issue.get('title', '')
          body = issue.get('body', '')

          # Проверяем, что это заявка на пакет
          if '[Package]' not in title:
              print('Not a package submission issue. Skipping.')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write('IS_PACKAGE=false\n')
              exit(0)

          # Парсим разметку формы (### Заголовок \n Значение)
          sections = re.split(r'###\s+', body)
          data = {}
          for sec in sections:
              if not sec.strip():
                  continue
              lines = sec.strip().split('\n')
              heading = lines[0].strip()
              value = '\n'.join(lines[1:]).strip()
              data[heading] = value

          name = data.get('Package Name', '').strip()
          version = data.get('Version', '').strip()
          description = data.get('Description', '').strip()
          url = data.get('Direct Download URL (.gpkg)', '').strip()

          if not name or not url:
              print(f'Error: Missing required fields. Name: \"{name}\", URL: \"{url}\"')
              exit(1)

          print(f'Successfully parsed: {name} v{version}')

          # Скачиваем .gpkg файл
          print(f'Downloading from {url}...')
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp, open('package.gpkg', 'wb') as out:
              out.write(resp.read())

          # Считаем SHA256
          hasher = hashlib.sha256()
          with open('package.gpkg', 'rb') as f:
              while chunk := f.read(8192):
                  hasher.update(chunk)
          sha256 = hasher.hexdigest()
          print(f'Calculated SHA256: {sha256}')

          # Гарантированно безопасное чтение/инициализация packages.json
          json_file = 'packages.json'
          pkg_data = {'packages': []}

          if os.path.exists(json_file):
              try:
                  with open(json_file, 'r', encoding='utf-8') as f:
                      loaded = json.load(f)
                      if isinstance(loaded, dict) and 'packages' in loaded and isinstance(loaded['packages'], list):
                          pkg_data = loaded
              except Exception as e:
                  print(f'Warning: Could not parse {json_file} ({e}). Re-initializing.')
                  pkg_data = {'packages': []}

          new_pkg = {
              'name': name,
              'version': version,
              'description': description,
              'url': url,
              'sha256': sha256
          }

          # Обновляем или добавляем пакет в список
          pkg_data['packages'] = [p for p in pkg_data.get('packages', []) if p.get('name') != name]
          pkg_data['packages'].append(new_pkg)

          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(pkg_data, f, indent=2, ensure_ascii=False)

          # Передаем переменные в следующие шаги
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('IS_PACKAGE=true\n')
              f.write(f'PKG_NAME={name}\n')
              f.write(f'PKG_SHA256={sha256}\n')
          "

      - name: Commit and Push changes
        if: env.IS_PACKAGE == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add package ${{ env.PKG_NAME }} via automated request"
          file_pattern: "packages.json"

      - name: Close Issue and Comment
        if: env.IS_PACKAGE == 'true'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            🎉 Поздравляем! Ваш пакет **${{ env.PKG_NAME }}** успешно добавлен в репозиторий G OS.
            SHA256: `${{ env.PKG_SHA256 }}`
