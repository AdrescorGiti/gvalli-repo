name: Process Package Submission

on:
  issues:
    types: [opened, edited]

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Issue, Download and Update JSON
        run: |
          # Создаем Python-скрипт в отдельный файл, чтобы избежать багов с кавычками в YAML
          cat << 'EOF' > process_script.py
          import json, os, re, hashlib, urllib.request

          with open(os.environ['GITHUB_EVENT_PATH'], 'r', encoding='utf-8') as f:
              event = json.load(f)

          title = event.get('issue', {}).get('title', '')
          body = event.get('issue', {}).get('body', '')

          if '[Package]' not in title:
              print('Not a package submission. Skipping.')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write('IS_PACKAGE=false\n')
              exit(0)

          data = {lines[0].strip(): '\n'.join(lines[1:]).strip() for sec in re.split(r'###\s+', body) if sec.strip() for lines in [sec.strip().split('\n')]}
          
          name = data.get('Package Name', '').strip()
          version = data.get('Version', '').strip()
          description = data.get('Description', '').strip()
          url = data.get('Direct Download URL (.gpkg)', '').strip()

          if not name or not url:
              print(f'Error: Missing fields. Name: "{name}", URL: "{url}"')
              exit(1)

          print(f'Successfully parsed: {name} v{version}')

          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp, open('package.gpkg', 'wb') as out:
              out.write(resp.read())

          hasher = hashlib.sha256()
          with open('package.gpkg', 'rb') as f:
              while chunk := f.read(8192):
                  hasher.update(chunk)
          sha256 = hasher.hexdigest()

          json_file = 'packages.json'
          pkg_data = {'packages': []}

          # Супер-безопасное чтение файла (даже если он пустой или битый)
          if os.path.exists(json_file) and os.path.getsize(json_file) > 0:
              try:
                  with open(json_file, 'r', encoding='utf-8') as f:
                      loaded = json.load(f)
                      if isinstance(loaded, dict) and 'packages' in loaded:
                          pkg_data = loaded
              except Exception as e:
                  print(f'Warning: Broken JSON ({e}). Re-initializing.')

          pkg_data['packages'] = [p for p in pkg_data.get('packages', []) if p.get('name') != name]
          pkg_data['packages'].append({'name': name, 'version': version, 'description': description, 'url': url, 'sha256': sha256})

          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(pkg_data, f, indent=2, ensure_ascii=False)

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('IS_PACKAGE=true\n')
              f.write(f'PKG_NAME={name}\n')
              f.write(f'PKG_SHA256={sha256}\n')
          EOF
          
          # Запускаем созданный файл
          python3 process_script.py

      - name: Commit and Push changes
        if: env.IS_PACKAGE == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add package ${{ env.PKG_NAME }} via automated request"
          file_pattern: "packages.json"

      - name: Close Issue and Comment
        if: env.IS_PACKAGE == 'true'
        uses: peter-evans/close-issue@v3
        with:
          comment: |
            🎉 Поздравляем! Ваш пакет **${{ env.PKG_NAME }}** успешно добавлен в репозиторий G OS.
            SHA256: `${{ env.PKG_SHA256 }}`
